name: Build and Release WingLightFinder Portable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: 1. Checkout Source Code (檢出公開原始碼)
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.14 (與本機打包版本一致)
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: 3. Install PyInstaller (只需要 PyInstaller，程式本身沒有外部套件)
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: 4. Unit Tests (單元測試)
        run: python -m unittest discover -s tests -v

      - name: 4b. Check Version Matches Tag (標籤要跟 core/version.py 一樣)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = (Select-String -Path core\version.py -Pattern '^VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "core/version.py 是 $v，標籤是 $env:GITHUB_REF_NAME" }

      - name: 5. Build, Self-Test & Package (編譯、自我測試並封裝)
        shell: pwsh
        run: |
          $releaseDir = "WingLightFinder_綠色免安裝版"
          pyinstaller --noconfirm --clean --log-level WARN --distpath "_dist_tmp" --workpath "build_tmp" WingLightFinder.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }

          $result = Join-Path (Get-Location).Path "selftest.json"
          $p = Start-Process -FilePath "_dist_tmp\WingLightFinder\WingLightFinder.exe" -ArgumentList "--self-test", "`"$result`"" -Wait -PassThru
          Get-Content $result -Encoding utf8
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }

          for ($i = 0; $i -lt 15; $i++) {
            try { Move-Item "_dist_tmp\WingLightFinder" $releaseDir -ErrorAction Stop; break }
            catch { if ($i -eq 14) { throw }; Start-Sleep -Seconds 1 }  # 自我測試剛結束時檔案可能被短暫鎖定
          }
          Copy-Item "使用說明.txt" -Destination "$releaseDir\" -Force
          Copy-Item "LICENSE" -Destination "$releaseDir\LICENSE.txt" -Force

          New-Item -ItemType Directory -Force -Path "$releaseDir\source_code\core", "$releaseDir\source_code\ui" | Out-Null
          Copy-Item "main.py", "WingLightFinder.spec", "README.md" -Destination "$releaseDir\source_code\" -Force
          Copy-Item "core\*.py" -Destination "$releaseDir\source_code\core\" -Force
          Copy-Item "ui\*.py" -Destination "$releaseDir\source_code\ui\" -Force

          # Release 附件檔名必須是英文，GitHub 會移除非 ASCII 字元
          Compress-Archive -Path "$releaseDir\*" -DestinationPath "WingLightFinder-$env:GITHUB_REF_NAME.zip" -Force

      - name: 6. Upload Artifacts (上傳雲端編譯成品)
        uses: actions/upload-artifact@v4
        with:
          name: WingLightFinder_綠色免安裝版
          path: WingLightFinder-*.zip

      - name: 7a. Remove Stale Release Assets (重跑同一版本時先刪除 Release 上的舊附件)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $names = gh release view $env:GITHUB_REF_NAME --json assets --jq '.assets[].name' 2>$null
          foreach ($n in $names) { if ($n) { gh release delete-asset $env:GITHUB_REF_NAME $n --yes } }
          exit 0

      - name: 7. Publish to GitHub Releases (自動發佈至 GitHub Releases)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: WingLightFinder-*.zip
          generate_release_notes: true
